name: Rebuild and publish

on:
  repository_dispatch:
    types: [rebuild]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checked out with GH_PAT rather than the default GITHUB_TOKEN: pushes made
      # with GITHUB_TOKEN do not trigger other workflows, so the tag pushed at
      # the end of this job would never start publish.yml. That is why v1.0.2
      # had to be released by hand even though this job already existed.
      - name: Checkout install
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Must precede the resolve step below: build.js requires esbuild.
      - name: Install install-repo dependencies
        run: npm ci

      # The repo slug and checkout directory come from build.js, which is the
      # only place they are defined. This step used to carry its own case
      # statement; it disagreed with build.js for six of eight MCPs.
      #
      # The dispatch payload is passed via `env`, not interpolated straight
      # into the `run:` string — inlining an `${{ }}` expression there lets
      # its value affect how the shell parses the rest of the script.
      - name: Resolve source repo
        id: src
        env:
          MCP_NAME: ${{ github.event.client_payload.mcp }}
        run: node scripts/build.js --meta "$MCP_NAME" >> "$GITHUB_OUTPUT"

      - name: Clone MCP source repo
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ steps.src.outputs.repo }}.git" \
            "../${{ steps.src.outputs.dir }}"

      - name: Install source dependencies
        run: npm install --ignore-scripts
        working-directory: ${{ github.workspace }}/../${{ steps.src.outputs.dir }}

      - name: Build bundle
        run: npm run build:${{ steps.src.outputs.mcp }}

      # A green esbuild run says nothing about whether the bundle can be
      # imported. This gate exists because three separate defects reached npm
      # behind a green build.
      - name: Smoke-test bundle
        run: npm run smoke -- ${{ steps.src.outputs.mcp }}

      - name: Bump patch version, commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- dist/; then
            echo "::notice::Bundle for ${{ steps.src.outputs.mcp }} is unchanged — nothing to release."
            exit 0
          fi

          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add dist/ package.json package-lock.json
          git commit -m "chore: rebuild ${{ steps.src.outputs.mcp }} → v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
