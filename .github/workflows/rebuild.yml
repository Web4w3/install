name: Rebuild and publish

on:
  repository_dispatch:
    types: [rebuild]

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout install
        uses: actions/checkout@v4

      - name: Clone MCP source repo
        run: |
          MCP="${{ github.event.client_payload.mcp }}"
          case "$MCP" in
            chrome-bridge)   REPO="Web4w3/chrome-bridge-mcp" ;;
            brotherhood)     REPO="Web4w3/brotherhood" ;;
            android-bridge)  REPO="Web4w3/android-desktop-bridge" ;;
            gmail)           REPO="Web4w3/gmail-mcp-server" ;;
            msteams)         REPO="Web4w3/MSTeams" ;;
            nut-js)          REPO="Web4w3/nut-js-mcp-server" ;;
            outlook)         REPO="Web4w3/outlook-mcp-server" ;;
            psql)            REPO="Web4w3/psql-mcp-server" ;;
            *)               echo "Unknown MCP: $MCP"; exit 1 ;;
          esac
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PAT }}@github.com/$REPO.git" "../$MCP"

      - name: Install source dependencies
        run: npm install --ignore-scripts
        working-directory: ${{ github.workspace }}/../${{ github.event.client_payload.mcp }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install install-repo dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build:${{ github.event.client_payload.mcp }}

      - name: Bump patch version, commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add dist/ package.json package-lock.json
          git commit -m "chore: rebuild ${{ github.event.client_payload.mcp }} → v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin main
          git push origin "v$VERSION"
