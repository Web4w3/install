name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip publish)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify dist files
        run: ls -lh dist/

      # Last line of defence: never publish a bundle that cannot start. Runs
      # against every committed bundle, so a regression in one MCP blocks the
      # release rather than shipping silently.
      - name: Smoke-test all bundles
        run: |
          status=0
          for f in dist/*.mjs; do
            name="$(basename "$f" .mjs)"
            node scripts/smoke.js "$name" || status=1
          done
          exit $status

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run — skipping publish."
          node -e "const p=require('./package.json'); console.log('Would publish: ' + p.name + '@' + p.version)"
